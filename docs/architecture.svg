<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1016" viewBox="0 0 1240 1016" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace"><rect width="1240" height="1016" fill="#0d0819"/><text x="620.0" y="44" font-size="24" fill="#f4ecff" font-weight="bold" text-anchor="middle">Violyx — how the system is built</text><text x="620.0" y="68" font-size="13" fill="#8f7fbf" font-weight="normal" text-anchor="middle">one 64-bit kernel in C and x86-64 assembly · keyboard only · no Linux underneath</text><rect x="20" y="88" width="1200" height="312" rx="12" fill="#160f28"/><text x="36" y="112" font-size="15" fill="#c56cff" font-weight="bold" text-anchor="start">RING 3</text><text x="113.6" y="112" font-size="12" fill="#8f7fbf" font-weight="normal" text-anchor="start">every program in its own address space · a crash only ends that program · the built-in ones too</text><text x="36" y="132" font-size="13" fill="#8f7fbf" font-weight="bold" text-anchor="start">Built-in programs</text><rect x="36.0" y="140" width="283.0" height="108" rx="8" fill="#24173f" stroke="#ff5cc8" stroke-width="1.5"/><text x="48.0" y="162" font-size="14" fill="#f4ecff" font-weight="bold" text-anchor="start">Browser</text><text x="48.0" y="182" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">HTML layout, tabs, bookmarks</text><text x="48.0" y="199" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">HTTP, gzip, cookies, downloads</text><text x="48.0" y="216" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">TLS 1.2 / 1.3 (Mbed TLS)</text><text x="48.0" y="233" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">pictures decoded in the program</text><rect x="331.0" y="140" width="283.0" height="108" rx="8" fill="#24173f" stroke="#7a5bc4" stroke-width="1.5"/><text x="343.0" y="162" font-size="14" fill="#f4ecff" font-weight="bold" text-anchor="start">Desktop programs</text><text x="343.0" y="182" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">Write · Files · Commands</text><text x="343.0" y="199" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">Calculator · Calendar</text><text x="343.0" y="216" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">Clock · Image viewer</text><text x="343.0" y="233" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">Paint (full screen)</text><rect x="626.0" y="140" width="283.0" height="108" rx="8" fill="#24173f" stroke="#7a5bc4" stroke-width="1.5"/><text x="638.0" y="162" font-size="14" fill="#f4ecff" font-weight="bold" text-anchor="start">Games</text><text x="638.0" y="182" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">Pong · Invaders</text><text x="638.0" y="199" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">Chomp · Mines</text><text x="638.0" y="216" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">Snake · Bricks · Novastrike</text><text x="638.0" y="233" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">sound and chiptune music</text><rect x="921.0" y="140" width="283.0" height="108" rx="8" fill="#24173f" stroke="#7a5bc4" stroke-width="1.5"/><text x="933.0" y="162" font-size="14" fill="#f4ecff" font-weight="bold" text-anchor="start">XZN</text><text x="933.0" y="182" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">music player</text><text x="933.0" y="199" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">MP3 · OGG · FLAC · WAV</text><text x="933.0" y="216" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">equalizer, spectrum, playlist</text><text x="933.0" y="233" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">mini player</text><text x="36" y="272" font-size="13" fill="#8f7fbf" font-weight="bold" text-anchor="start">Libraries inside the programs</text><rect x="36.0" y="280" width="381.3333333333333" height="108" rx="8" fill="#24173f" stroke="#7a5bc4" stroke-width="1.5"/><text x="48.0" y="302" font-size="14" fill="#f4ecff" font-weight="bold" text-anchor="start">System runtime (system/rt.c)</text><text x="48.0" y="322" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">windows, drawing, dialogs</text><text x="48.0" y="339" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">files, system services</text><text x="48.0" y="356" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">waits for the network</text><text x="48.0" y="373" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">while the rest keeps running</text><rect x="429.3333333333333" y="280" width="381.3333333333333" height="108" rx="8" fill="#24173f" stroke="#7a5bc4" stroke-width="1.5"/><text x="441.3333333333333" y="302" font-size="14" fill="#f4ecff" font-weight="bold" text-anchor="start">SDK (violyx.h)</text><text x="441.3333333333333" y="322" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">for your own programs</text><text x="441.3333333333333" y="339" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">dialogs, files, pictures</text><text x="441.3333333333333" y="356" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">network: Violyx asks once</text><text x="441.3333333333333" y="373" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">installed from a .vpk file</text><rect x="822.6666666666666" y="280" width="381.3333333333333" height="108" rx="8" fill="#24173f" stroke="#7a5bc4" stroke-width="1.5"/><text x="834.6666666666666" y="302" font-size="14" fill="#f4ecff" font-weight="bold" text-anchor="start">Picture decoder</text><text x="834.6666666666666" y="322" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">PNG · JPEG · GIF · BMP, gzip</text><text x="834.6666666666666" y="339" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">(stb_image) built into</text><text x="834.6666666666666" y="356" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">the browser and the viewer</text><text x="834.6666666666666" y="373" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start"></text><line x1="36" y1="420" x2="1204" y2="420" stroke="#ff5cc8" stroke-width="2" stroke-dasharray="8 6"/><rect x="300.0" y="406" width="640" height="28" rx="14" fill="#0d0819" stroke="#ff5cc8" stroke-width="1.5"/><text x="620" y="425" font-size="13" fill="#ff5cc8" font-weight="bold" text-anchor="middle">int 48 · 29 system calls · every pointer and path is checked</text><rect x="20" y="446" width="1200" height="454" rx="12" fill="#160f28"/><text x="36" y="470" font-size="15" fill="#c56cff" font-weight="bold" text-anchor="start">KERNEL</text><text x="113.6" y="470" font-size="12" fill="#8f7fbf" font-weight="normal" text-anchor="start">ring 0 · only what has to be there: desktop, programs, files, network stack, drivers</text><text x="36" y="490" font-size="13" fill="#8f7fbf" font-weight="bold" text-anchor="start">Desktop</text><rect x="36.0" y="498" width="381.3333333333333" height="108" rx="8" fill="#24173f" stroke="#7a5bc4" stroke-width="1.5"/><text x="48.0" y="520" font-size="14" fill="#f4ecff" font-weight="bold" text-anchor="start">Window manager</text><text x="48.0" y="540" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">text grid in 256 colours</text><text x="48.0" y="557" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">picture cells for images</text><text x="48.0" y="574" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">menus, dialogs, schemes</text><text x="48.0" y="591" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">screen savers</text><rect x="429.3333333333333" y="498" width="381.3333333333333" height="108" rx="8" fill="#24173f" stroke="#7a5bc4" stroke-width="1.5"/><text x="441.3333333333333" y="520" font-size="14" fill="#f4ecff" font-weight="bold" text-anchor="start">System shell</text><text x="441.3333333333333" y="540" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">Programs overview · Help</text><text x="441.3333333333333" y="557" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">Settings · System info</text><text x="441.3333333333333" y="574" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">Installer</text><text x="441.3333333333333" y="591" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">formatting USB sticks</text><rect x="822.6666666666666" y="498" width="381.3333333333333" height="108" rx="8" fill="#24173f" stroke="#ff5cc8" stroke-width="1.5"/><text x="834.6666666666666" y="520" font-size="14" fill="#f4ecff" font-weight="bold" text-anchor="start">Programs</text><text x="834.6666666666666" y="540" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">ELF loader, address spaces</text><text x="834.6666666666666" y="557" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">preemptive time slices</text><text x="834.6666666666666" y="574" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">access checks, permissions</text><text x="834.6666666666666" y="591" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">system services</text><text x="36" y="630" font-size="13" fill="#8f7fbf" font-weight="bold" text-anchor="start">Services</text><rect x="36.0" y="638" width="283.0" height="108" rx="8" fill="#24173f" stroke="#7a5bc4" stroke-width="1.5"/><text x="48.0" y="660" font-size="14" fill="#f4ecff" font-weight="bold" text-anchor="start">Files</text><text x="48.0" y="680" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">/home /downloads /programs</text><text x="48.0" y="697" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">/system /drives</text><text x="48.0" y="714" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">VioFS 2 · FAT32 · exFAT</text><rect x="331.0" y="638" width="283.0" height="108" rx="8" fill="#24173f" stroke="#7a5bc4" stroke-width="1.5"/><text x="343.0" y="660" font-size="14" fill="#f4ecff" font-weight="bold" text-anchor="start">Network</text><text x="343.0" y="680" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">lwIP: TCP/IP, DHCP, DNS</text><text x="343.0" y="697" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">TCP and DNS for programs</text><text x="343.0" y="714" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">one connection at a time</text><text x="343.0" y="731" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">ping</text><rect x="626.0" y="638" width="283.0" height="108" rx="8" fill="#24173f" stroke="#7a5bc4" stroke-width="1.5"/><text x="638.0" y="660" font-size="14" fill="#f4ecff" font-weight="bold" text-anchor="start">Sound</text><text x="638.0" y="680" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">mixer for voices</text><text x="638.0" y="697" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">music stream for XZN</text><text x="638.0" y="714" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">volume, outputs</text><rect x="921.0" y="638" width="283.0" height="108" rx="8" fill="#24173f" stroke="#7a5bc4" stroke-width="1.5"/><text x="933.0" y="660" font-size="14" fill="#f4ecff" font-weight="bold" text-anchor="start">Core</text><text x="933.0" y="680" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">memory and paging</text><text x="933.0" y="697" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">interrupts and timers</text><text x="933.0" y="714" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">clock (RTC)</text><text x="933.0" y="731" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">ACPI, clean shutdown</text><text x="36" y="770" font-size="13" fill="#8f7fbf" font-weight="bold" text-anchor="start">Drivers</text><rect x="36.0" y="778" width="224.0" height="106" rx="8" fill="#24173f" stroke="#7a5bc4" stroke-width="1.5"/><text x="48.0" y="800" font-size="14" fill="#f4ecff" font-weight="bold" text-anchor="start">Storage</text><text x="48.0" y="820" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">IDE · AHCI (SATA)</text><text x="48.0" y="837" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">NVMe</text><text x="48.0" y="854" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">multi-sector reads</text><rect x="272.0" y="778" width="224.0" height="106" rx="8" fill="#24173f" stroke="#7a5bc4" stroke-width="1.5"/><text x="284.0" y="800" font-size="14" fill="#f4ecff" font-weight="bold" text-anchor="start">USB (xHCI)</text><text x="284.0" y="820" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">keyboards, hubs</text><text x="284.0" y="837" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">mass storage</text><text x="284.0" y="854" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">audio (UAC 1 and 2)</text><rect x="508.0" y="778" width="224.0" height="106" rx="8" fill="#24173f" stroke="#7a5bc4" stroke-width="1.5"/><text x="520.0" y="800" font-size="14" fill="#f4ecff" font-weight="bold" text-anchor="start">Network cards</text><text x="520.0" y="820" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">Intel E1000</text><text x="520.0" y="837" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">Realtek RTL8125B</text><text x="520.0" y="854" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">Realtek RTL8126</text><rect x="744.0" y="778" width="224.0" height="106" rx="8" fill="#24173f" stroke="#7a5bc4" stroke-width="1.5"/><text x="756.0" y="800" font-size="14" fill="#f4ecff" font-weight="bold" text-anchor="start">Sound chips</text><text x="756.0" y="820" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">Intel HD Audio, AC'97</text><text x="756.0" y="837" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">USB audio</text><text x="756.0" y="854" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">e.g. Realtek ALC4080</text><rect x="980.0" y="778" width="224.0" height="106" rx="8" fill="#24173f" stroke="#7a5bc4" stroke-width="1.5"/><text x="992.0" y="800" font-size="14" fill="#f4ecff" font-weight="bold" text-anchor="start">Input / output</text><text x="992.0" y="820" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">PS/2 keyboard</text><text x="992.0" y="837" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">framebuffer</text><text x="992.0" y="854" font-size="12" fill="#cbbcf0" font-weight="normal" text-anchor="start">PCI / PCIe scan</text><rect x="20" y="916" width="1200" height="80" rx="12" fill="#160f28"/><text x="36" y="940" font-size="15" fill="#c56cff" font-weight="bold" text-anchor="start">BOOT</text><text x="94.4" y="940" font-size="12" fill="#8f7fbf" font-weight="normal" text-anchor="start"></text><rect x="36.0" y="952" width="381.3333333333333" height="36" rx="8" fill="#24173f" stroke="#7a5bc4" stroke-width="1.5"/><text x="48.0" y="974" font-size="14" fill="#f4ecff" font-weight="bold" text-anchor="start">Limine boot loader</text><rect x="429.3333333333333" y="952" width="381.3333333333333" height="36" rx="8" fill="#24173f" stroke="#7a5bc4" stroke-width="1.5"/><text x="441.3333333333333" y="974" font-size="14" fill="#f4ecff" font-weight="bold" text-anchor="start">BIOS and UEFI</text><rect x="822.6666666666666" y="952" width="381.3333333333333" height="36" rx="8" fill="#24173f" stroke="#7a5bc4" stroke-width="1.5"/><text x="834.6666666666666" y="974" font-size="14" fill="#f4ecff" font-weight="bold" text-anchor="start">x86-64 PC · QEMU · VirtualBox</text></svg>